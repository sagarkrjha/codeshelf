name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Concurrency group ensures optimistic cancellation: in-flight PR checks cancel when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node.js with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @codeshelf/shared build

      - name: Cache Shared Build Dist
        uses: actions/cache@v4
        with:
          path: packages/shared/dist
          key: shared-dist-${{ github.sha }}

      - name: Typecheck Workspaces
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      - name: Run Benchmarks
        run: pnpm run bench

  build-all:
    name: Build Monorepo Workspaces
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node.js with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Shared Build Dist
        uses: actions/cache@v4
        with:
          path: packages/shared/dist
          key: shared-dist-${{ github.sha }}

      - name: Build Web, Desktop, Shared & VS Code
        run: pnpm run build

      - name: Bundle VS Code Extension
        run: pnpm run vscode:package
