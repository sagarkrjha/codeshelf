name: Release Desktop & Extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.2)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: pnpm run desktop:dist:win
            artifact_pattern: apps/desktop/release/*.exe
          - os: macos-latest
            platform: macos
            build_cmd: pnpm run desktop:dist:mac
            artifact_pattern: apps/desktop/release/*.dmg
          - os: ubuntu-latest
            platform: linux
            build_cmd: pnpm run desktop:dist:linux
            artifact_pattern: apps/desktop/release/*.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @codeshelf/shared build

      - name: Build Web Assets First
        run: pnpm run web:build

      - name: Build Desktop Distribution (${{ matrix.platform }})
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: warn

  build-vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @codeshelf/shared build

      - name: Package VSIX
        run: pnpm run vscode:package

      - name: Upload VS Code Extension (.vsix)
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: apps/vscode/*.vsix
          if-no-files-found: warn

  create-github-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-vscode]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-assets/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: release-assets/macos

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: release-assets/linux

      - name: Download VS Code Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: release-assets/vscode

      - name: Determine Release Tag
        id: tag_info
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=v0.2.2" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.RELEASE_TAG }}
          name: CodeShelf ${{ steps.tag_info.outputs.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/windows/*
            release-assets/macos/*
            release-assets/linux/*
            release-assets/vscode/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
